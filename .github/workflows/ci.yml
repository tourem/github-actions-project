name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish to GitHub Packages
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      
      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      
      - name: Build with Maven
        run: mvn -B clean verify --file pom.xml
      
      - name: Run tests
        run: mvn -B test --file pom.xml
      
      - name: Package applications
        run: mvn -B package -DskipTests --file pom.xml
      
      - name: Publish to GitHub Packages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        run: mvn -B deploy -DskipTests --file pom.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload task-api JAR
        uses: actions/upload-artifact@v4
        with:
          name: task-api-jar
          path: task-api/target/task-api.jar
          retention-days: 30

      - name: Upload task-api ZIP
        uses: actions/upload-artifact@v4
        with:
          name: task-api-distribution
          path: task-api/target/task-api-*.zip
          retention-days: 30

      - name: Upload task-batch JAR
        uses: actions/upload-artifact@v4
        with:
          name: task-batch-jar
          path: task-batch/target/task-batch.jar
          retention-days: 30

      - name: Upload task-batch ZIP
        uses: actions/upload-artifact@v4
        with:
          name: task-batch-distribution
          path: task-batch/target/task-batch-*.zip
          retention-days: 30

      - name: Generate build info
        if: success()
        run: |
          echo "Build completed successfully!" > build-info.txt
          echo "Branch: ${{ github.ref_name }}" >> build-info.txt
          echo "Commit: ${{ github.sha }}" >> build-info.txt
          echo "Build time: $(date)" >> build-info.txt
          cat build-info.txt

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.txt
          retention-days: 30

