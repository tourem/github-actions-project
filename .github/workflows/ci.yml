name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      dockerfile_branch:
        description: 'Branch of docker-file-common repository to use'
        required: false
        default: 'main'
        type: string
      environment:
        description: 'Environment to deploy (dev, hml, prd)'
        required: false
        default: 'dev'
        type: choice
        options:
          - dev
          - hml
          - prd

jobs:
  build-and-deploy:
    name: Build and Deploy
    permissions:
      contents: read
      packages: write
    uses: tourem/github-actions-common/.github/workflows/maven-docker-build.yml@main
    with:
      # Configuration Maven
      java-version: '21'
      maven-version: '3.9'
      maven-pom: 'pom.xml'
      
      # Configuration Dockerfile
      dockerfile-repo: 'tourem/docker-file-common'
      dockerfile-branch: ${{ github.event.inputs.dockerfile_branch || 'main' }}
      
      # Modules Docker à builder
      # Note: La configuration dépend de l'environnement (conf-dev, conf-hml, conf-prd)
      docker-modules: |
        [
          {
            "name": "task-api",t st
            "artifact": "com.larbotech:task-api:jar",
            "config": "com.larbotech:task-api:zip:conf-${{ github.event.inputs.environment || 'dev' }}"
          },
          {
            "name": "task-batch",
            "artifact": "com.larbotech:task-batch:jar",
            "config": "com.larbotech:task-batch:zip:conf-${{ github.event.inputs.environment || 'dev' }}"
          }
        ]
      
      # Options
      skip-tests: false
      docker-build-enabled: true
    
    secrets: inherit

  generate-deployment-descriptors:
    name: Generate Deployment Descriptors
    needs: build-and-deploy
    runs-on: ubuntu-latest
    if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') || github.event_name == 'workflow_dispatch')

    permissions:
      contents: write

    strategy:
      matrix:
        module: [task-api, task-batch]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Maven version
        id: get-version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout -f pom.xml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Maven version: $VERSION"

      - name: Generate deployment descriptor for ${{ matrix.module }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          chmod +x scripts/generate-deployment-descriptor.sh
          ./scripts/generate-deployment-descriptor.sh \
            "${{ matrix.module }}" \
            "${{ steps.get-version.outputs.version }}" \
            "${{ github.event.inputs.environment || 'dev' }}" \
            "ghcr.io" \
            "https://maven.pkg.github.com/${{ github.repository }}"

      - name: Upload deployment descriptor
        uses: actions/upload-artifact@v4
        with:
          name: deployment-descriptor-${{ matrix.module }}
          path: ${{ matrix.module }}/deploy/deployment-descriptor-${{ matrix.module }}.json
          retention-days: 90

      - name: Commit and push deployment descriptor
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add ${{ matrix.module }}/deploy/deployment-descriptor-${{ matrix.module }}.json

          if git diff --staged --quiet; then
            echo "✅ Aucun changement à committer"
          else
            git commit -m "chore: update deployment descriptor for ${{ matrix.module }} [${{ steps.get-version.outputs.version }}]"
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Deployment descriptor committed and pushed"
          fi

      - name: Generate deployment summary
        run: |
          echo "## 📦 Deployment Descriptor: ${{ matrix.module }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.get-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**File:** \`${{ matrix.module }}/deploy/deployment-descriptor-${{ matrix.module }}.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Content:**" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          cat ${{ matrix.module }}/deploy/deployment-descriptor-${{ matrix.module }}.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

