# Exemple : Avec Déclenchement Manuel
#
# Contexte :
# - Permettre de choisir la branche du Dockerfile manuellement
# - Utile pour tester différentes versions du Dockerfile
# - Java 21
#
# Utilisation :
# 1. Aller dans Actions sur GitHub
# 2. Cliquer sur "Run workflow"
# 3. Saisir la branche Dockerfile (ex: develop, feature/test)
# 4. Cliquer sur "Run workflow"

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      dockerfile_branch:
        description: 'Branch of Dockerfile repository to use'
        required: false
        default: 'main'
        type: string
      skip_tests:
        description: 'Skip Maven tests'
        required: false
        default: false
        type: boolean

jobs:
  build-and-deploy:
    name: Build and Deploy
    uses: tourem/github-actions-common/.github/workflows/maven-docker-build.yml@main
    with:
      # Configuration Maven
      java-version: '21'
      maven-version: '3.9'
      maven-pom: 'pom.xml'
      
      # Configuration Dockerfile (avec input manuel)
      dockerfile-repo: 'tourem/docker-file-common'
      dockerfile-branch: ${{ github.event.inputs.dockerfile_branch || 'main' }}
      
      # Modules
      docker-modules: |
        [
          {
            "name": "my-app",
            "artifact": "com.example:my-app:jar",
            "config": "com.example:my-app:zip:conf"
          }
        ]
      
      # Options (avec input manuel pour skip-tests)
      skip-tests: ${{ github.event.inputs.skip_tests == 'true' }}
      docker-build-enabled: true
    
    secrets: inherit

# Résultat :
# - Déclenchement automatique : utilise Dockerfile@main
# - Déclenchement manuel : utilise la branche spécifiée
# - Possibilité d'ignorer les tests manuellement

