# Exemple : Application Multi-Modules
#
# Contexte :
# - Application avec backend API et batch
# - Java 21
# - Deux services distincts
#
# Structure du projet :
# my-project/
# ├── pom.xml (parent)
# ├── backend/
# │   ├── pom.xml
# │   └── src/
# ├── batch/
# │   ├── pom.xml
# │   └── src/
# └── .github/workflows/ci.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-deploy:
    name: Build and Deploy
    uses: tourem/github-actions-common/.github/workflows/maven-docker-build.yml@main
    with:
      # Configuration Maven
      java-version: '21'
      maven-version: '3.9'
      maven-pom: 'pom.xml'
      
      # Configuration Dockerfile
      dockerfile-repo: 'tourem/docker-file-common'
      dockerfile-branch: 'main'
      
      # Modules multiples
      docker-modules: |
        [
          {
            "name": "backend",
            "artifact": "com.example:backend:jar",
            "config": "com.example:backend:zip:distribution"
          },
          {
            "name": "batch",
            "artifact": "com.example:batch:jar",
            "config": "com.example:batch:zip:distribution"
          }
        ]
      
      # Options
      skip-tests: false
      docker-build-enabled: true
    
    secrets: inherit

# Résultat :
# - Build Maven de backend et batch
# - Tests exécutés pour les deux modules
# - Publication vers GitHub Packages
# - Images Docker :
#   - ghcr.io/{owner}/{repo}/backend:latest
#   - ghcr.io/{owner}/{repo}/batch:latest

