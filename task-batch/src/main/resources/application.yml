server:
  port: 8081

spring:
  application:
    name: task-batch
  
  datasource:
    url: jdbc:h2:mem:batchdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Configuration du batch
task:
  api:
    base-url: http://localhost:8080
  batch:
    # Cron expression: toutes les 30 minutes
    # Format: seconde minute heure jour mois jour-semaine
    # "0 0/30 * * * ?" = à la minute 0 de chaque 30 minutes
    cron: "0 0/30 * * * ?"
    # Pour tester plus rapidement, utiliser: "0 0/2 * * * ?" (toutes les 2 minutes)

logging:
  level:
    com.larbotech.taskbatch: INFO
    org.springframework.scheduling: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

