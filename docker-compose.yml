version: '3.8'

services:
  task-api:
    image: ghcr.io/tourem/github-actions-project/task-api:latest
    container_name: task-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "com.larbotech.service=task-api"
      - "com.larbotech.version=1.0-SNAPSHOT"

  task-batch:
    image: ghcr.io/tourem/github-actions-project/task-batch:latest
    container_name: task-batch
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - SERVER_PORT=8081
      - TASK_API_URL=http://task-api:8080
      - TASK_API_BASE_URL=http://task-api:8080
    depends_on:
      task-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "com.larbotech.service=task-batch"
      - "com.larbotech.version=1.0-SNAPSHOT"

networks:
  app-network:
    driver: bridge
    name: larbotech-network

